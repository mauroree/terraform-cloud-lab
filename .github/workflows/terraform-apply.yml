name: Terraform Apply (CD)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente de deploy"
        required: true
        default: "dev"

jobs:
  terraform-apply:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file=${{ github.event.inputs.environment }}.tfvars
      
      - name: Get ALB DNS
        id: alb
        run: echo "url=http://$(terraform output -raw alb_dns_name)/" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: pip install requests

      - name: Healthcheck
        run: python scripts/healthcheck.py 
        env:
          APP_URL: ${{ steps.alb.outputs.url }}